# Retrieval / answer evaluation set.
#
# evidence: verbatim spans from the corpus. A question is "hit@k" when any of the
#   top-k retrieved chunks contains any evidence span (whitespace-insensitive).
# kind:
#   lexical      the question shares key terms with the source
#   paraphrase   same meaning, different words (tests semantic retrieval)
#   unanswerable the corpus does not contain the answer (tests refusal)
# answer: short fact the generated answer must contain (answer evals only).

