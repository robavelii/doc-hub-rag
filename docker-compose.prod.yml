name: Doc-Hub

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  migrate:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_SYNC_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ragdb
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"
    networks: [internal]

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://app_user:${DATABASE_APP_PASSWORD}@postgres:5432/ragdb
      DATABASE_SYNC_URL: postgresql://app_user:${DATABASE_APP_PASSWORD}@postgres:5432/ragdb
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal, web]

  celery_worker:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app_user:${DATABASE_APP_PASSWORD}@postgres:5432/ragdb
      DATABASE_SYNC_URL: postgresql://app_user:${DATABASE_APP_PASSWORD}@postgres:5432/ragdb
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    networks: [internal]

  celery_beat:
    build: ./backend
    env_file: backend/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_SYNC_URL: postgresql://app_user:${DATABASE_APP_PASSWORD}@postgres:5432/ragdb
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
      - dashboard
      - landing
      - widget_cdn
    restart: unless-stopped
    networks: [web]

  landing:
    build:
      context: ./frontend
      dockerfile: landing/Dockerfile
    restart: unless-stopped
    networks: [web]

  dashboard:
    build:
      context: ./frontend
      dockerfile: dashboard/Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    networks: [web]

  widget_cdn:
    build:
      context: ./frontend
      dockerfile: widget/Dockerfile
    restart: unless-stopped
    networks: [web]

volumes:
  postgres_data:
  minio_data:
  caddy_data:

networks:
  internal:
    internal: true
  web:
