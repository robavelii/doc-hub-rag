# Host nginx reverse proxy for Doc-Hub (doc-hub.robelfekadu.com)
# Install: sudo cp deploy/nginx/doc-hub.conf /etc/nginx/sites-available/doc-hub
#          sudo ln -sf /etc/nginx/sites-available/doc-hub /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d doc-hub.robelfekadu.com

upstream doc_hub_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

upstream doc_hub_landing {
    server 127.0.0.1:8081;
}

upstream doc_hub_dashboard {
    server 127.0.0.1:3000;
}

upstream doc_hub_widget {
    server 127.0.0.1:3002;
}

server {
    listen 80;
    listen [::]:80;
    server_name doc-hub.robelfekadu.com;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://doc_hub_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /metrics {
        return 403;
    }

    location /widget/ {
        proxy_pass http://doc_hub_widget/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://doc_hub_dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://doc_hub_landing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
