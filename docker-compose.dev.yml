name: Doc-Hub

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible storage: SeaweedFS (MinIO community images are discontinued).
  s3:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"dev","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256 -volume.max=0 -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    volumes:
      - s3_data:/data
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  s3_data:
