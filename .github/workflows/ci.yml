name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Lint
        working-directory: backend
        run: pip install ruff && ruff check app tests --ignore E501
      - name: Run unit tests
        working-directory: backend
        run: pytest tests/unit tests/security -q

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_SYNC_URL: postgresql://postgres:postgres@localhost:5432/ragdb
          DATABASE_APP_PASSWORD: app_user_dev_password
        run: alembic upgrade head
      - name: Run integration tests (RLS as app_user)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://app_user:app_user_dev_password@localhost:5432/ragdb
          DATABASE_SYNC_URL: postgresql://app_user:app_user_dev_password@localhost:5432/ragdb
          DATABASE_ADMIN_SYNC_URL: postgresql://postgres:postgres@localhost:5432/ragdb
          POSTGRES_PASSWORD: postgres
          AI_PROVIDER: mock
        run: pytest tests/integration -m integration -q --tb=short

  backend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_SYNC_URL: postgresql://postgres:postgres@localhost:5432/ragdb
          DATABASE_APP_PASSWORD: app_user_dev_password
        run: alembic upgrade head
      - name: Run e2e tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://app_user:app_user_dev_password@localhost:5432/ragdb
          DATABASE_SYNC_URL: postgresql://app_user:app_user_dev_password@localhost:5432/ragdb
          DATABASE_ADMIN_SYNC_URL: postgresql://postgres:postgres@localhost:5432/ragdb
          POSTGRES_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          AI_PROVIDER: mock
        run: pytest -m e2e -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [dashboard, landing, widget]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install and build
        working-directory: frontend/${{ matrix.app }}
        run: |
          npm install
          npm run typecheck
          if [ "${{ matrix.app }}" = "dashboard" ]; then npm run test; fi
          npm run build

  docker-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [backend, dashboard, landing, widget]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          if [ "${{ matrix.target }}" = "backend" ]; then
            docker build -t doc-hub-backend ./backend
          else
            docker build -f frontend/${{ matrix.target }}/Dockerfile -t doc-hub-${{ matrix.target }} ./frontend
          fi
